name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out composite.js
        uses: actions/checkout@v6
        with:
          repository: composite-js/composite.js
          ref: master

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          output="$(pnpm install --frozen-lockfile --reporter=append-only 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if (( status != 0 )); then
            message="$(printf '%s\n' "$output" | tail -n 15 | tr '\n' ' ')"
            message="${message//'%'/'%25'}"
            printf '::error title=pnpm install failed::%s\n' "$message"
            exit "$status"
          fi

      - name: Build site
        run: pnpm run site:build
        env:
          SITE_URL: https://composite-js.github.io
          SITE_BASE_PATH: /

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
